<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Ai Demo Dashboard</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5; /* 浅灰背景，保护视力且显高级 */
            font-family: "Helvetica Neue", Helvetica, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "微软雅黑", Arial, sans-serif;
        }
        .header-bar {
            background-color: #409EFF;
            color: white;
            padding: 15px 40px;
            box-shadow: 0 2px 12px 0 rgba(0, 0, 0, 0.1);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }
        .header-bar h1 {
            margin: 0;
            font-size: 24px;
            font-weight: 500;
        }
        .main-container {
            width: 90%;
            max-width: 1400px;
            margin: 0 auto;
            padding-bottom: 40px;
        }
        .box-card {
            margin-bottom: 20px;
            border-radius: 8px; /* 圆角优化 */
        }
        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: bold;
            font-size: 16px;
        }
        .card-header i {
            margin-right: 8px;
            color: #409EFF;
        }
        .input-area {
            margin-bottom: 15px;
        }
        .upload-demo .el-upload {
            display: block;
        }
        .upload-demo .el-upload-dragger {
            width: 100%;
        }
        /* 调整按钮位置 */
        .action-row {
            margin: 15px 0;
            text-align: right;
        }
    </style>
</head>
<body>

<div id="app">
    <div class="header-bar">
        <i class="el-icon-menu" style="font-size: 28px; margin-right: 15px;"></i>
        <h1>My AI Demo 演示平台</h1>
    </div>

    <div class="main-container">
        <el-row :gutter="20">
            <el-col :span="24">
                <el-card class="box-card" shadow="hover">
                    <div slot="header" class="card-header">
                        <span><i class="el-icon-edit-outline"></i>NLP 自然语言处理</span>
                    </div>
                    <el-row :gutter="20">
                        <el-col :span="18">
                            <el-input
                                    placeholder="请输入需要纠错的文本内容..."
                                    v-model="nlp_input"
                                    type="textarea"
                                    :rows="3"
                                    clearable>
                            </el-input>
                        </el-col>
                        <el-col :span="6" style="display: flex; flex-direction: column; justify-content: center;">
                            <el-button type="primary" icon="el-icon-magic-stick" @click="nlp_correction" style="width: 100%; height: 100%;">开始纠错</el-button>
                        </el-col>
                    </el-row>
                    <div style="margin-top: 15px;">
                        <el-alert title="识别结果" type="info" :closable="false" style="margin-bottom: 10px;"></el-alert>
                        <el-input
                                type="textarea"
                                :rows="2"
                                placeholder="等待输出结果..."
                                v-model="nlp_output"
                                readonly>
                        </el-input>
                    </div>
                </el-card>
            </el-col>
        </el-row>

        <el-row :gutter="20">
            <el-col :xs="24" :sm="12">
                <el-card class="box-card" shadow="hover">
                    <div slot="header" class="card-header">
                        <span><i class="el-icon-picture-outline"></i>图像识别</span>
                    </div>
                    <el-upload
                            class="upload-demo"
                            drag
                            action="http://127.0.0.1:8080/img"
                            :on-success="imgUploadFile"
                            multiple>
                        <i class="el-icon-upload"></i>
                        <div class="el-upload__text">将图像拖到此处，或<em>点击上传</em></div>
                        <div class="el-upload__tip" slot="tip">只能上传jpg/png文件，且不超过500kb</div>
                    </el-upload>
                    <div style="margin-top: 15px;">
                        <span style="font-size: 14px; color: #606266; display:block; margin-bottom:5px;">识别结果：</span>
                        <el-input
                                type="textarea"
                                :autosize="{ minRows: 3, maxRows: 6}"
                                placeholder="暂无数据"
                                v-model="img_output"
                                readonly>
                        </el-input>
                    </div>
                </el-card>
            </el-col>

            <el-col :xs="24" :sm="12">
                <el-card class="box-card" shadow="hover">
                    <div slot="header" class="card-header">
                        <span><i class="el-icon-document"></i>文字识别 (OCR)</span>
                    </div>
                    <el-upload
                            class="upload-demo"
                            drag
                            action="http://127.0.0.1:8080/word"
                            :on-success="wordUploadFile"
                            multiple>
                        <i class="el-icon-upload"></i>
                        <div class="el-upload__text">将文档图片拖到此处，或<em>点击上传</em></div>
                        <div class="el-upload__tip" slot="tip">只能上传jpg/png文件，且不超过500kb</div>
                    </el-upload>
                    <div style="margin-top: 15px;">
                        <span style="font-size: 14px; color: #606266; display:block; margin-bottom:5px;">识别结果：</span>
                        <el-input
                                type="textarea"
                                :autosize="{ minRows: 3, maxRows: 10}"
                                placeholder="暂无数据"
                                v-model="word_output"
                                readonly>
                        </el-input>
                    </div>
                </el-card>
            </el-col>
        </el-row>

        <el-row>
            <el-col :span="24">
                <el-card class="box-card" shadow="hover">
                    <div slot="header" class="card-header">
                        <span><i class="el-icon-time"></i>历史记录查询</span>
                        <el-button type="primary" size="small" icon="el-icon-search" @click="getContent">刷新列表</el-button>
                    </div>

                    <el-table
                            :data="ocrContentList"
                            border
                            stripe
                            style="width: 100%">
                        <el-table-column
                                prop="id"
                                label="ID"
                                width="80"
                                align="center">
                        </el-table-column>
                        <el-table-column
                                prop="content"
                                label="识别结果"
                                show-overflow-tooltip>
                        </el-table-column>
                        <el-table-column
                                prop="type"
                                label="类型"
                                width="100"
                                align="center">
                            <template slot-scope="scope">
                                <el-tag :type="scope.row.type === 'NLP' ? 'success' : 'primary'" disable-transitions>{{scope.row.type}}</el-tag>
                            </template>
                        </el-table-column>
                        <el-table-column
                                prop="createTime"
                                label="创建时间"
                                width="180"
                                align="center">
                        </el-table-column>
                        <el-table-column
                                prop="modifyTime"
                                label="修改时间"
                                width="180"
                                align="center">
                        </el-table-column>
                        <el-table-column label="操作" width="100" align="center">
                            <template slot-scope="scope">
                                <el-button
                                        size="mini"
                                        type="danger"
                                        icon="el-icon-delete"
                                        circle
                                        @click="deleteRow(scope.$index, scope.row)"></el-button>
                            </template>
                        </el-table-column>
                    </el-table>
                </el-card>
            </el-col>
        </el-row>
    </div>
</div>

</body>

<script src="https://cdn.bootcss.com/vue/2.5.16/vue.min.js"></script>
<script src="https://unpkg.com/element-ui/lib/index.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script>
    new Vue({
        el: '#app',
        data:{
            "nlp_input": "",
            "nlp_output": "",
            "img_output": "",
            "word_output": "",
            "ocrContentList": [] // 初始化建议用空数组而不是空字符串，虽然原代码是""，但我这里保持原样以防万一，但建议改为 []
        },
        methods:{
            getContent(){
                axios.get("http://127.0.0.1:8080/getAllContent",{
                }).then(res=>{
                    this.ocrContentList = res.data;
                    console.log(res.data);
                })
            },
            deleteRow(index, row) {
                this.$confirm('确认删除该记录吗?', '提示', {
                    confirmButtonText: '确定',
                    cancelButtonText: '取消',
                    type: 'warning'
                }).then(() => {
                    axios.delete("http://127.0.0.1:8080/deleteContent",{
                        params:{
                            id:row.id
                        }
                    }).then(res=>{
                        console.log(res.data);
                        console.log(index, row);
                        this.getContent();
                        this.$message({
                            type: 'success',
                            message: '删除成功!'
                        });
                    })
                }).catch(() => {
                    // 取消删除
                });
            },
            nlp_correction(){
                axios.get("http://127.0.0.1:8080/nlp",{
                    params:{
                        text:this.nlp_input
                    }
                }).then(res=>{
                    this.nlp_output = res.data;
                    console.log(res.data);
                    this.$message({
                        showClose: true,
                        message: '纠错成功',
                        type: 'success'
                    });
                })
            },
            imgUploadFile(res,file){
                this.img_output = res;
                console.log(res);
                this.$message({
                    showClose: true,
                    message: '识别成功',
                    type: 'success'
                });
            },
            wordUploadFile(res,file){
                console.log("123");
                this.word_output = res
                console.log(res);
                this.$message({
                    showClose: true,
                    message: '识别成功',
                    type: 'success'
                });
            }
        }
    })
</script>

</html>
